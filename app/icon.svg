<!-- V76 · CP13 — L'audit a mesuré un 404 sur `/favicon.ico` à chaque première
     visite, et l'erreur de console qui va avec. Ce n'est pas une question de
     décoration : une erreur permanente dans la console est une ligne rouge qu'on
     apprend à ignorer, et une console qu'on ignore ne signale plus rien.

     Convention Next.js : `app/icon.svg` fournit l'icône du site. Aucun
     dépendance, aucune image binaire, les couleurs du thème. -->
